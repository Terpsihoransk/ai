spring.application.name=ai

server.port=8081
# Max size of request HTTP headers (Tomcat default is 8KB).
# The prompt is sent in the POST body, but spare room is useful for large cookies/URLs.
server.max-http-request-header-size=64KB

spring.ai.ollama.base-url=http://localhost:11431
spring.ai.ollama.chat.model=gemma3:4b-it-q4_K_M

# Chat memory context window: how many last messages to pass to the model
chat.memory.max-messages=12

spring.datasource.url=jdbc:postgresql://localhost:5433/ragdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ==== Logging (logback) ====
# Root logger level
logging.level.root=INFO
# Application logger level
logging.level.ru.ars.ai=DEBUG
# Hibernate SQL queries
logging.level.org.hibernate.SQL=INFO
# SQL bind parameters (? -> actual value)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Spring AI
logging.level.org.springframework.ai=DEBUG
# Silence Spring AI metadata DEBUG messages ("Ignore null value for key ...")
logging.level.org.springframework.ai.chat.metadata=INFO