spring.application.name=ai

server.port=8081
# Max size of request HTTP headers (Tomcat default is 8KB).
# The prompt is sent in the POST body, but spare room is useful for large cookies/URLs.
server.max-http-request-header-size=64KB

spring.ai.ollama.base-url=http://localhost:11431
spring.ai.ollama.chat.model=gemma3:4b-it-q4_K_M

# Chat memory context window: how many last messages to pass to the model
chat.memory.max-messages=12

# RAG advisor: how many nearest chunks from vector_store to inject into the prompt
rag.advisor.top-k=4

# SSE connection timeout in milliseconds (used by SseStreamBridge for SseEmitter)
sse.timeout-ms=300000

spring.datasource.url=jdbc:postgresql://localhost:5433/ragdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ==== Flyway: migrations own the schema ====
# Hibernate only validates the schema (ddl-auto=validate) and never creates or alters anything.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Migrating an existing DB without a flyway_schema_history table (baseline) must not fail.
# baseline-version=0 makes sure V1 is still applied (for already existing data).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ==== Spring AI PgVectorStore: the schema is owned by Flyway ====
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-validation=false
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.id-type=text
spring.ai.vectorstore.pgvector.distance-type=cosine-distance
spring.ai.vectorstore.pgvector.index-type=hnsw

# ==== Logging (logback) ====
# Root logger level
logging.level.root=INFO
# Application logger level
logging.level.ru.ars.ai=DEBUG
# Hibernate SQL queries
logging.level.org.hibernate.SQL=INFO
# SQL bind parameters (? -> actual value)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Spring AI
logging.level.org.springframework.ai=DEBUG
# Silence Spring AI metadata DEBUG messages ("Ignore null value for key ...")
logging.level.org.springframework.ai.chat.metadata=INFO